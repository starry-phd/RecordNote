name: RecordNote secrets and Battery key scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 requires a paid organization license.
      # Use the upstream open-source Gitleaks CLI instead of silently skipping
      # security scanning or requiring an owner to purchase a license.
      - name: Scan tracked repository history with open-source Gitleaks CLI
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git \
            --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 /repo

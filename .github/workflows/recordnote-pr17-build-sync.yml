# One-shot branch-limited builder for PR #17. Remove after the audited artifact lands.
name: RecordNote PR17 audited Worker bundle sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cloudflare-candidate/recordnote-web.mjs'
      - 'scripts/build-recordnote-unified.mjs'
      - 'vendor/starry-id/starry-client.ts'
      - '.github/workflows/recordnote-pr17-build-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.number == 17 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/starry-id-v2026-11-09-2-settings-routes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/starry-id-v2026-11-09-2-settings-routes
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate audited deployable bundle without Cloudflare deployment
        run: |
          npm install --no-audit --no-fund
          npm run build:recordnote
          node scripts/build-recordnote-unified.mjs --check
      - name: Commit only generated bundle on PR branch
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare-candidate/recordnote-unified.mjs; then
            echo 'Bundle already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-candidate/recordnote-unified.mjs
          git commit -m "build(recordnote): synchronize official SDK v2026-11-09.2 Worker"
          git push origin HEAD:refs/heads/feat/starry-id-v2026-11-09-2-settings-routes

# One-shot PR #19 bundle generation; never deploy Cloudflare.
name: RecordNote PR19 audited Worker bundle sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cloudflare-candidate/recordnote-web.mjs'
      - 'cloudflare-candidate/recordnote-worker.js'
      - 'scripts/build-recordnote-unified.mjs'
      - 'vendor/starry-id/starry-client.ts'
      - '.github/workflows/recordnote-pr19-build-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.number == 19 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/recordnote-starry-id-v2026-11-09-6-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recordnote-starry-id-v2026-11-09-6-admin
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate audited Worker without cloud deployment
        run: |
          npm install --no-audit --no-fund
          npm run build:recordnote
          node scripts/build-recordnote-unified.mjs --check
      - name: Commit generated Worker to PR branch only
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare-candidate/recordnote-unified.mjs; then
            echo "Worker already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-candidate/recordnote-unified.mjs
          git commit -m "build(recordnote): sync official Starry ID 09.6 admin Worker"
          git push origin HEAD:refs/heads/feat/recordnote-starry-id-v2026-11-09-6-admin

name: RecordNote metadata tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/m4a-mdta.mjs'
      - 'src/web-recordnote-metadata.js'
      - 'tests/**'
      - '.github/workflows/recordnote-metadata-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recordnote-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata-node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run metadata and safe-fallback tests
        run: node --test tests/*.test.mjs
